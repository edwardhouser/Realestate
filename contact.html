<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./mystyle.css">
    <script src="https://kit.fontawesome.com/62390ecb04.js" crossorigin="anonymous"></script>
    <title> Contact Us </title>
    
</head>
<body>
    <header class=" header-style">
        <div class="menu-bar">
            <h1> <a href="/index.html"> Real Estate </a> </h1>
            <nav class="menu">
                <a href="#"> About </a>
                <a href="#"> Blog </a>
                <a href="/contact.html"> Contact </a>
            </nav>
        </div>
        <p> We sell luxury houses, condominiums, and penthouses </p>
    </header>
    <main class="container">
        <div class="contact-text">
        <h2> Contact Us </h2>
        <p> Please fill out the information below </p>
        <p> Lorem ipsum dolor sit amet consectetur adipisicing elit. Sequi, deserunt.
        <i class="fa-solid fa-circle-info"></i></p>
        </div><br><br>
        <form class="contact-form container">
            <fieldset>
                <legend> Personal Information </legend>
                <div class="form-control">
                    <label> Name: </label>
                    <input type="text">
                </div>
                <div class="form-control">
                    <label> Email: </label>
                    <input type="email">
                </div>
                <div class="form-control">
                    <label> Phone: </label>
                    <input type="tel">
                </div>
                <div class="form-control">
                    <label> Message: </label>
                    <textarea></textarea>
                </div>
            </fieldset>
        </form>
    </main>
    <footer class="contact-footer">
        <div>
            <h2> Powered by <span class="underline"> Zillow</span></h2>
        </div>
        <div>
            <p> Copyright &copy; 2024 <span>Privacy Policy</span></p>
        </div>
        <div>
            <label> <i class="fa-brands fa-youtube"></i> </label>
            <label> <i class="fa-brands fa-facebook"></i> </label>
            <label> <i class="fa-brands fa-linkedin"></i> </label>
        </div>
    </footer>
</body>
</html>
